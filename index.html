<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise | Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>SpendWise</h1>
    <p>Track your income and expenses in one place.</p>
  </header>

  <main>
    <section id="budget-section" class="budget-section" aria-labelledby="budget-heading">
      <h2 id="budget-heading">Set Your Budget</h2>
      <p id="budget-message">No budget has been set yet.</p>
      <button type="button" id="set-budget-button">Set Budget with Prompt</button>
    </section>

    <section id="add-expense" class="expense-section" aria-labelledby="add-expense-heading">
      <h2 id="add-expense-heading">Add Expense</h2>
      <form id="expense-form">
        <div class="input-group">
          <label for="expense-name">Expense name</label>
          <input type="text" id="expense-name" name="expense-name" placeholder="e.g. Groceries" required>
        </div>
        <div class="input-group">
          <label for="expense-amount">Amount</label>
          <input type="number" id="expense-amount" name="expense-amount" placeholder="0.00" min="0.01" step="0.01" required>
        </div>
        <div class="input-group">
          <label for="expense-category">Category</label>
          <input type="text" id="expense-category" name="expense-category" placeholder="e.g. Food" required>
        </div>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section id="your-expenses" class="expenses-section" aria-labelledby="your-expenses-heading">
      <h2 id="your-expenses-heading">Your Expenses</h2>
      <ul id="expense-list">
        <li class="empty-state">No expenses yet.</li>
      </ul>
      <div class="summary" aria-live="polite">
        <p>Total spent: <strong id="total-spent">$0.00</strong></p>
        <p>Remaining balance: <strong id="remaining-balance">Set a budget first</strong></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
