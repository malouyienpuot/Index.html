<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>My Budget Tracker</h1>
    <p>Track your income and expenses in one place.</p>
  </header>

  <main>
    <section id="add-expense" class="expense-section" aria-labelledby="add-expense-heading">
      <h2 id="add-expense-heading">Add Expense</h2>
      <form>
        <div class="input-group">
          <label for="expense-name">Expense name</label>
          <input type="text" id="expense-name" name="expense-name" placeholder="e.g. Groceries">
        </div>

        <div class="input-group">
          <label for="expense-amount">Amount</label>
          <input type="number" id="expense-amount" name="expense-amount" placeholder="0.00" min="0" step="0.01">
        </div>

        <div class="input-group">
          <label for="expense-category">Category</label>
          <input type="text" id="expense-category" name="expense-category" placeholder="e.g. Food">
        </div>
      </form>
    </section>

    <section id="your-expenses" class="expenses-section" aria-labelledby="your-expenses-heading">
      <h2 id="your-expenses-heading">Your Expenses</h2>
      <p class="empty-state">No expenses yet.</p>
    </section>
  </main>
</body>
</html>
